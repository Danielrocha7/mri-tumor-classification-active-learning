name: mri-tumor-classification-active-learning
channels:
  - conda-forge
dependencies:
  # numpy, pandas, scikit-learn, matplotlib and pillow are pinned to the versions used to run scripts 14 and 15 and
  # the tests (on Python 3.10); this file was not yet built with conda on the target machine.
  # torch and torchvision (scripts 07 and 13) ran on Kaggle. Their versions were read on 2026-11-19 from the
  # Kaggle image of that day (Python 3.13, torch 2.11.0, torchvision 0.26.0, CUDA 13.0), a few days after the
  # runs, so the image may have changed in between. They are pinned below through pip; not yet installed from this file.
  - python=3.11
  - pip
  - numpy=2.2.6
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - matplotlib-base=3.10.9
  - pillow=12.3.0
  - pyyaml
  - pytest
  - ipykernel
  - jupyterlab
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - imagehash
      - pywebview
      - bcrypt
